[package]
name = "photon-fe"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = { version = "0.8", default-features = false, features = ["csr"] }
leptos_router = { version = "0.8", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window", "Document", "Element", "HtmlInputElement",
    "HtmlLabelElement", "Storage", "File", "Blob", "FileList",
    "DragEvent", "DataTransfer", "console",
    "FormData", "Request", "RequestInit", "Response",
] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
gloo-timers = { version = "0.4", features = ["futures"] }
serde-wasm-bindgen = "0.6"
